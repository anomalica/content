    content: Richard C. Hoagland objected to the use of the term Search for Extraterrestrial Intelligence (SETI) because he
      considered it a moniker developed by Carl Sagan for radio astronomy searches for stray radio signals from other stellar
      systems, which Hoagland believed gave unnecessary credibility to what he saw as a waste of time or an outright scam.
    original_excerpt: He objected to the use of the term “SETI.” This was a moniker developed by Carl Sagan for the use of
      radio astronomy to scan for stray radio signals from other stellar systems... Hoagland felt that the use of SETI gave
      unnecessary credibility to what he had come to believe was a waste of time at best or an outright scam at worst.
