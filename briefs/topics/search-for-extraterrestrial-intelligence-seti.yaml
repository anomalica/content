    content: Tyler D. considers the Search for Extraterrestrial Intelligence (SETI) to be looking in the wrong places with
      the wrong sensors, since a laser detector is unlikely to find anything, though it obtains funding.
    original_excerpt: SETI [the Search for Extraterrestrial Intelligence] seems to look in all the wrong places with the wrong
      sensors. I guess any search is better than no search but it won’t come from a laser detector. The best detectors are
      humans like you and their net results and may be certain light frequencies or the study of physical relics. The wavelength
      of optical lasers is unlikely to find anything. But it sounds good and can obtain funding.
