    content: In the Coordinate Remote Viewing protocol, since there is no outbounder site the viewer can visit for feedback,
      the person who controls the targeting information or target pool provides the viewer with as much feedback as feasible
      about the original target after the remote viewing has been completed.
    original_excerpt: Since there is no outbounder site that the remote viewer can visit for feedback after the remote viewing
      has been completed and information evaluated, it becomes necessary to provide the viewer with as much information as
      is feasible about the original target after the remote viewing has been completed. The person who controls the targeting
      information or the target pool is usually the person tasked with this.
