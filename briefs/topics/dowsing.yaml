    content: When using dowsing to locate something on a map after remote viewing, the remote viewing should be done first,
      then progressively larger to smaller maps should be dowsed, narrowing from a country-level map down to a specific area,
      so that examining map details does not front-load the viewer on what to expect.
    original_excerpt: you probably want to do the remote viewing first... Usually this is accomplished in some sort of progressive
      way. If you are looking for a kidnapped victim who could be anywhere in America, then you obviously have to start with
      a map of America... You do the remote viewing first, so that looking at the map details does not front-load you on what
      to expect.
