    content: Joseph McMoneagle considers it better to perform dowsing after a remote viewing session rather than before, because
      maps used for dowsing can front-load a viewer with information about the actual target, and performing it afterward
      lets the remote viewer's stronger psychic sense of the target improve the dowsing results.
