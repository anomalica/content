    claim_hash: 8f9f48b5d7d7c304d01d22625fecfab54236b8a172133ae4fbfe6f94d48562f5
    content: Luis Elizondo said that unlike purpose-built vehicles designed for a specific environment, an observed object
      can operate in atmosphere, space and potentially underwater without changing its design characteristics, which he considers
      would be a game-changer if any single one of the five observable characteristics were possessed by a foreign adversary.
    original_excerpt: ‘Everything we build is purpose specific for its environment. A plane looks like a plane, has wings,
      has engines, has a rudder, has a nose because it has to be aerodynamic. Yet here’s an object that can operate just as
      easily in atmosphere, in space and potentially even underwater and yet it doesn’t change its design characteristics.
      What type of technology could allow that? Any one of these, mind, would be an absolute game-changer for any foreign
      adversary to have. Just one of them. It would be a game changer and yet here we have things doing all five,’ Elizondo
      emphasised.
