    content: When pushed to its limits, a preferred counter-hypothesis to the survival hypothesis is that mediums' information
      can be explained by extrasensory perception (ESP) by living persons, sometimes called the super-ESP hypothesis.
    original_excerpt: When pushed to its limits, the preferred counterhypothesis to the survivalistic one is that mediums’
      information can be more simply and satisfactorily explained in terms of ESP by living persons. Since we do not know
      the limits of ESP we can never say for certain that ESP of the extraordinary extent that would often be necessary—“super-ESP”—is
      actually impossible.
