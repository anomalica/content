      even after brain function has been lost, though the ability to receive it into waking awareness is lost.
    original_excerpt: as soon as the function of the brain has been lost, like turning off the TV, memories and consciousness
      do still exist, but the reception ability is lost; the connection, or interface, is interrupted. Yet consciousness can
