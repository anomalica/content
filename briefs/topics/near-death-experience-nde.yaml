    content: Bruce Greyson wrote that no single physiological or psychological model by itself explains all the common features
      of near-death experiences, and that a clear sensorium and complex perceptual processes during a period of apparent clinical
      death challenge the concept that consciousness is localised exclusively in the brain.
    original_excerpt: He wrote, “No one physiological or psychological model by itself explains all the common features of
      near-death experiences…A clear sensorium and complex perceptual processes during a period of apparent clinical death
      challenge the concept that consciousness is localized exclusively in the brain.”
