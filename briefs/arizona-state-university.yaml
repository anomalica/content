    content: The official Arizona State University caption for the paired daytime and nighttime Thermal Emission Imaging System
      (THEMIS) infrared images of the Face on Mars stated that the nighttime image was acquired on 2002-10-24 and the daytime
      image was originally released on 2002-07-24, both of THEMIS's ninth infrared band at 12.57 microns, geometrically projected
      for image registration.
    original_excerpt: “This pair of THEMIS infrared images shows the so-called ‘Face on Mars’ landform viewed during both
