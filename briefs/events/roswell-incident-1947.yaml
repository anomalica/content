      making counteraccusations, retrieving crashed craft pieces, moving retrieved materials to undisclosed locations, reverse-engineering
      the technology in secret, locking down scientists and engineers near the wreckage, intimidating and discrediting witnesses,
      and stigmatising the topic.
    original_excerpt: 'Roswell codified how this nation and all others would react to future UAP incidents going forward.
      The US government scripted the universal UAP playbook in the hours and days following that mysterious incident in New
      Mexico: 1. Admit nothing and deny everything. 2. Make counteraccusations. 3. Retrieve the pieces of the crashed craft.
      4. Whisk the retrieved materials away to undisclosed locations. 5. Work in secret to reverse-engineer this vastly superior
      technology. Lock down all scientists and engineers who come near the recovered wreckage. 6. Intimidate witnesses into
      saying nothing. Discredit those who don’t play along. Make them look crazy. Paint abductees as country bumpkins or glory-seeking
      frauds. Stigmatize outside researchers who attempt to intelligently glean truth. Stigmatize the topic.'
