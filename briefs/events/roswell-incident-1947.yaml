    content: In a 2016 email, Tom DeLonge wrote that Neil McCasland claimed to be a sceptic but really was not, that DeLonge
      had worked with him for four months and recently given him a four-hour presentation on the entire project, that advice
      was already being provided on how to proceed, and that when Roswell crashed the wreckage was shipped to the laboratory
      at Wright-Patterson Air Force Base, which McCasland had been in charge of until a couple of years earlier, and that
      McCasland had helped assemble DeLonge's advisory team.
    original_excerpt: '''He mentioned he''s a sceptic, he''s not,'' a clearly frustrated DeLonge wrote after the 2016 meeting.
      ''I''ve been working with him for four months. I just got done giving him a four-hour presentation on the entire project
      a few weeks ago. Trust me, the advice is already been happening on how to do all this. He just has to say that out loud,
      but he is very, very aware – as he was in charge of all of the stuff. When Roswell crashed, they shipped it to the laboratory
      at Wright-Patterson Air Force Base. General McCasland was in charge of that exact laboratory up to a couple years ago.
      He not only knows what I''m trying to achieve, he helped assemble my advisory team. He''s a very important man.'''
