    content: At the 17 May 2022 US Congress public hearing on UAP, Mike Gallagher asked Ronald S. Moultrie and Scott W. Bray
      whether they were aware of any Department of Defense or DOD contract programs focused on UAP from a technological engineering
      perspective, and both replied they were not aware of anything beyond the Navy UAP Task Force.
    original_excerpt: 'Gallagher: Are you aware of any other DOD or DOD contract programs focused on UAPs from a technological
      engineering perspective …? Mr. Moultrie: I am not aware of any contractual programs that are focused on any anything
      related to this, other than what we are doing in the Navy task force and what we are about to launch in terms of our
      effort. Mr. Gallagher: Same question for you, Mr. Bray. Mr. Bray: Same answer. Not aware of anything outside what we
      are doing in the UAP Task Force.'
