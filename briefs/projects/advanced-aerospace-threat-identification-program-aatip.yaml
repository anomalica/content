    content: The second observable identified by the Advanced Aerospace Threat Identification Program (AATIP) for unidentified
      aerial phenomena (UAP) is instantaneous acceleration, a sudden increase in velocity, including high-speed turns that
      would normally require a conventional aircraft many kilometres to complete.
    original_excerpt: The next observable is instantaneous acceleration, which is defined as a sudden increase in velocity.
      The UAP we are observing are traveling at 13,000 miles per hour, sometimes faster, and instantaneously accelerating
