  - claim_id: fefd4719-3e2d-4c4a-aa80-ada2ea9c3d95
    claim_hash: 4768117d39dc78f267a7ba9087f7785ca783a812b6b78149f282d0779506a344
    content: During his early days at the Advanced Aerospace Weapons System Application Program/Advanced Aerospace Threat
      Identification Program (AAWSAP/AATIP), Lue Elizondo brought an unclassified US Air Force-commissioned document on teleportation
      to read while at his daughter's lacrosse practice on Maryland's Eastern Shore.
    original_excerpt: One afternoon during my early days at AAWSAP/AATIP I took my oldest daughter to lacrosse practice somewhere
