    content: Harrison Schmitt had hoped to receive a real-time summary of the ground science team's thinking during the Apollo
      17 flight, based on data transmitted verbally and via television camera, but this was not possible due to real-time
      discussions in mission control.
    original_excerpt: Post-flight, it's my understanding that some of the things I had hoped could be done during the flight
      were not possible because of real-time discussions in the mission control. Specifically, one of those things was to
      have some summary of the thinking of the science background given to me while in flight, and that would be the thinking
      based on the data that we had transmitted to them verbally and to, in a sense, visually through the television camera.
