    content: The Apollo 16 Lunar Module had a problem with its Service Propulsion System engine just before the planned deorbit
      burn, delaying the intended landing time for several hours until the date changed to April 20th, at which point the
      problem cleared and the astronauts were given the go-ahead to land.
    original_excerpt: the Lunar Module on Apollo 16 had "a problem" with it's critical SPS engine just before the planned
      "deorbit burn" ... which delayed the intending landing time for several nail-biting hours, while NASA trouble-shot various
      engineering possibilities from Earth. This process dragged on and on … until the date of "April 20th" clicked over on
      the clock. Then, suddenly, the "problem" cleared itself—and the astronauts were given the go-ahead to land on "the next
      rev"
