    content: After the Apollo 11 crew's liftoff from the Moon in the Lunar Module Eagle and rendezvous with the Command Module
      Columbia in lunar orbit, Columbia Broadcasting System (CBS)'s unit relocated to the Jet Propulsion Laboratory (JPL)
      in Pasadena to cover the remainder of the flight.
    original_excerpt: After the heady events of that unforgettable 32 hours... the successful liftoff of the Lunar Module
      "Eagle" and rendezvous with the Command Module "Columbia," still in lunar orbit—CBS moved our unit up the street, to
      the Jet Propulsion Laboratory (JPL) in Pasadena.
