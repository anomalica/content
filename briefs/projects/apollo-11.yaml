    content: Richard C. Hoagland argues that National Aeronautics and Space Administration (NASA) choosing to send an unproven,
      poor-quality black-and-white camera to the Moon on Apollo 11, despite the existence of superior colour technology, is
      consistent with concern inside the agency about how much viewers would be able to see.
    original_excerpt: Despite the existence of a vastly superior color technology, NASA chose to send an unproven and very
