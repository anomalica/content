  - claim_id: 7e297fe6-cd33-4839-937e-2a15fcff8860
    claim_hash: 1daba23d642d8ca4a708b55f9cd7328e9d2fb784363fb1c498189ee640521542
    content: Richard C. Hoagland reasoned that if the Pinpoint for Science producers had taken rush hardcopy prints from the
      original Hasselblad Moon shots and placed them under intense lights on an Oxberry Animation Stand to add pans and zooms,
      then vital invisible detail in the otherwise pitch black lunar skies over the Apollo 12 landing site might remain detectable
      by computer, even after several generations of copying onto 16mm release prints.
    original_excerpt: Hoagland reasoned that if the *Pinpoint for Lunar Landing* producers had taken rush 8x10 hardcopy prints
      from the original Hasselblad Moon shots, placed them under the intense lights on a professional Oxberry Animation Stand
      ... then on those frames of the 16mm release print, even after several generations of copying, some vital, invisible
      detail in the otherwise pitch black lunar skies over the Apollo 12 landing site might remain—still detectable by the
      computer.
