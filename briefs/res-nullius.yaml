  - claim_id: ed6a3eb3-6e4e-4949-b628-74f924c5a906
    claim_hash: a40cb8f4ff0d416b3deed437ee13dbc7dd34dfe9f396c9acf1a52d742109899d
    content: J. Robert Oppenheimer and Albert Einstein argue that if it could be established that a celestial body within
      the solar system, such as the moon, was or is occupied by another celestial race, no state on Earth could claim it as
      res nullius, and it would instead exist as res communis, meaning all celestial states would have equal rights over it.
    original_excerpt: If it could be established that a celestial body within our solar system such as our moon was, or is
      occupied by another celestial race, there could be no claim of res nullius by any state on earth (if that state should
      decide in the future to send explorers to lay claim to it). It would exist as res communis, that is that all celestial
      states have the same rights over it.
