  content: While working on his book The Fourth Mind, Whitley Strieber needed a scientific
    paper he could not retrieve through Google or Google's academic search, so he
    prompted an artificial intelligence system to describe it in detail and immediately
    received an apparently complete PDF of the paper.
  original_excerpt: I guess I was working on the fourth mind, and AI was sort of coming
    into the world. I needed a paper that came up in the implant and I knew the paper
    existed, but I couldn't ... get the site out of Google ... So I put in a prompt
    to describe the paper in detail and here comes the paper immediately. ... It was
    a PDF and everything.
