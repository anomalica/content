  claim_hash: 15b7508168d063d657d87fd90464caccb61f132c0000bef78043a2ef17da38b5
  content: The Agreement on Measures to Reduce the Risk of Outbreak of Nuclear War,
    signed in 1971, is an unclassified publicly available treaty in the United Nations
    register; its declassified provisions from 2013, including red-line flash message
    traffic codes pursuant to Article Three, are held in the George Washington University
    National Security Archive and the previously classified National Security Agency
    (NSA) archive.
