    content: Sur Novel recalled that his father Gordon Novel was involved with people connected to Watergate and was politically
      connected with black operations before those connections were cut off for conducting domestic operations the Central
      Intelligence Agency was not tasked to do.
    original_excerpt: '''He would find a conspiracy theory where conspiracies didn''t exist because it was kind of like his
      calling card because he was involved in a lot of you know wild shit when he was younger, and you know with the JFK assassination.
      And then he was involved with these guys that were doing the Watergate shit and you know, up until Watergate, he was
      politically connected with the black ops and then those guys all kinda got wiped out because they were doing domestic
      operations in the US and that''s not what the CIA is tasked to do.'''
