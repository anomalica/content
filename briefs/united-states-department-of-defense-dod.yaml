  content: The Historical Record Report is provided by the Department of Defense in
    response to a requirement established in Section 6802(j) of the National Defense
    Authorization Act for Fiscal Year 2023, which requires a written report detailing
    the historical record of the United States Government relating to UAP submitted
    to congressional defense and intelligence committees and congressional leadership
    not later than 540 days after enactment of the Intelligence Authorization Act
    for Fiscal Year 2023.
