  claim_hash: 3d90faf0363185049afbfc4e54ef593f3503345043889742a95d70b59f8d3448
  content: The Condon Report panel investigated Frank Edwards's 1966 claim about a
    UFO fragment recovered near Washington, D.C. in the summer of 1952, and found
    that Project BLUE BOOK was not aware of this claim, that the United States Air
    Force and United States Navy found no incident report of weapons engagement with
    a UFO that summer, that no United States Navy aircraft were present, and that
    the retired officer who was the original source of the claim had retired before
    the summer of 1952, when the event allegedly occurred.
  original_excerpt: Project BLUE BOOK was not aware of this claim. The USAF and USN
    found no incident report of weapons engagement with a UFO that summer, no USN
    aircraft were present, and the retired officer who was the original source of
    the claim had retired before the summer of 1952, when the event allegedly occurred.
