      Fatima on 1917-05-13, an attempt had been made to assassinate him, and he recognised in that connection a specific call
      to come.
    original_excerpt: “I have come because on this day, a year ago, an attempt was made to assassinate the pope, strangely
      enough, on the anniversary of the first apparition of Fatima on May thirteenth, 1917,” he said. “I recognized, in the
