    content: Mike Simone addressed the importance of selecting and training native speaking linguists/analysts born and raised
      in the target language, region and culture, and linguists and analysts born and raised in the United States, so that
      individuals from both categories could be combined into a multicultural linguist/analyst team that functions more effectively
      together than either group would individually.
