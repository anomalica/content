    claim_hash: 51655c0dad9bc1fb1e395d669e795c16d62ca21205c10f624f8e1376d51f91ad
    content: In 1969, a patient at Pim van Lommel's coronary care unit suffered a cardiac arrest from ventricular fibrillation
      following a heart attack, became unresponsive, and was defibrillated twice before his cardiac rhythm was reestablished
      and he regained consciousness more than a minute later, after about four minutes of unconsciousness.
    original_excerpt: A patient with a heart attack had a cardiac arrest (ventricular fibrillation), and was no longer responsive...
      Then the patient was defibrillated for the second time. This time his cardiac rhythm was reestablished, and more than
      a minute later, he regained consciousness, after being unconsciousness for about four minutes.
    claim_type: observation
    attestation: first_hand
