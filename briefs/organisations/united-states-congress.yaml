      the use of NASA funds for cooperation with Russia, or any other nation: “No part of any appropriation made available
      to the National Aeronautics and Space Administration by this act shall be used for expenses of participating in a manned
      lunar landing to be carried out jointly by the United States and any other country without consent of the Congress.”'
