    content: In a 2019 lecture to the Scientific Coalition for UAP Studies, Luis Elizondo showed a composite picture of retrieved
      metamaterials held by To The Stars Academy of Arts & Sciences, saying some samples are absolutely special, have been
      briefed to very senior levels of the government, do remarkable and extraordinary things, and to that day could not be
      replicated.
    original_excerpt: He showed his audience a composite picture of some of the retrieved metamaterials held by TTSA, telling
      them, 'I won't point out which one's on that slide but there are some that are absolutely special and have been briefed
      to some very, very senior levels of this government. And they do remarkable and extraordinary things. And they're built
      in such a way that to this day, we still can't replicate them. To this day. So that should be very telling.'
