    content: In a November 2021 memorandum, the Office of the Under Secretary of Defense for Intelligence and Security (OUSD(I&S))
      was directed to establish the Airborne Object Identification and Management Synchronization Group (AOIMSG) as the successor
      to the UAP Task Force (UAPTF) to synchronise efforts across the United States Department of Defense (DoD) and with other
      Federal departments and agencies to detect, identify, and characterise objects of interest in special use airspace.
    original_excerpt: In a November 2021 memorandum, the Deputy Secretary of Defense directed the OUSD(I&S) to establish the
      Airborne Object Identification and Management Synchronization Group (AOIMSG) as the successor to the UAPTF to synchronize
      efforts across the DoD and with other Federal departments and agencies to detect, identify, and characterize objects
      of interest in special use airspace.
