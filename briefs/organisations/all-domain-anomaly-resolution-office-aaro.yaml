    claim_hash: b8ef43d557c70e0d2e5686cc62ada7f3c6ad77ecddcbaf4620c10819064040da
    content: 'The All-Domain Anomaly Resolution Office (AARO) categorised its interviewees into three tiers: Tier 1 interviewees
      are those who have spoken with congressional staff or Members of Congress and were subsequently referred to AARO; Tier
