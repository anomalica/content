    content: The mission of the All-domain Anomaly Resolution Office (AARO) is to synchronise efforts across the United States
      Department of Defense (DoD) and with other Federal departments and agencies to detect, identify, and characterise objects
      of interest in, on, or near military installations, operating areas, training areas, special use airspace, and other
      areas of interest, and, as necessary, to mitigate any associated threats to safety of operations and national security.
    original_excerpt: The mission of AARO is to "synchronize efforts across the Department and with other Federal departments
      and agencies to detect, identify, and characterize objects of interest in, on, or near military installations, operating
      areas, training areas, special use airspace, and other areas of interest, and, as necessary, to mitigate any associated
      threats to safety of operations and national security."
