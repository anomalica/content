    content: In May 1873, Saint Don Bosco had a vision of a dark night in which a crowd of men, women, old people, children,
      monks, nuns, and priests, headed by the pope, came out of the Vatican in procession before a violent storm darkened
      a magnificent light, and a square appeared covered with corpses and wounded people.
    original_excerpt: '"It was a dark night, the people were unable to discern which way to take to return to their homes,
      when in the heavens a magnificent light appeared, illuminating the paths of the wanderers as if it was midday. In this
      moment, a crowd of men, women, old people, children, monks, nuns, and priests, headed by the pope, came out of the Vatican
      and formed a procession. But behold, there came a violent storm. It darkened the light and a battle between the light
      and the darkness seemed to develop. Meanwhile, I saw a square covered with corpses and wounded people.…"'
