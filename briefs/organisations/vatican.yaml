    content: Some people in the Vatican opposed the consecration of Russia because they aimed to first establish diplomatic
      connections with Moscow, fearing the Soviets might interpret a papal proclamation as intervention in their internal
      affairs and jeopardise hopes of relief for Christians in Russia.
