    content: Provisions requiring an independent agency such as the Government Accountability Office (GAO) or the Department
      of Defense Office of Inspector General (DOD IG) to oversee UAP program reporting were included in the original draft
      UAP legislation but were dropped from the statute that finally passed as the National Defense Authorization Act 2023.
