    content: The Invention Secrecy Act of 1951 allows the US government to impose secrecy orders on patent applications that
      contain sensitive information, preventing the inventor from registering the patent or publicising the invention.
    original_excerpt: As the Federation of American Scientists' Project on Government Secrecy explains, the Invention Secrecy
      Act of 1951 has long allowed the US government to impose secrecy orders on patent applications that contain sensitive
      information, which stops the inventor from either getting their patent registered or publicising their invention.
