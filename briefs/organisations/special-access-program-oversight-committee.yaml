  - claim_id: e30cf449-f005-45e4-9138-763a5df4e65f
    claim_hash: 278b538bb2e394624f54b5669ffbea83a68b240232777c32d1256a1bced510b9
    content: After the prior investigator episode, a formal agreement was struck between the Watch Committee and the Special
      Access Programs Oversight Committee (SAPOC) establishing special access criteria, administered by the contractor committee
      (programme director, attorney, security director), requiring US government personnel to meet the criteria regardless
      of their tickets and position.
    original_excerpt: "- Said after that episode a formal agreement was struck with Pentagon people (SAPOC) to prevent this
      in future - didn't want a repeat\n- Special criteria were established in agreement\n - A special circumstance that must
      meet rigorous access criteria set by contractor committee\n- No USG personnel are to gain access unless they met the
      criteria - to be administered by contractor committee (program director, attorney, security director) irregardless of
      the tickets and position USG personnel possessed\n- Literally their way or the highway"
    claim_type: testimony
    attestation: second_hand
