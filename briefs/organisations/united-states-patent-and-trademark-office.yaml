    content: The United States Patent and Trademark Office rejected Salvatore Pais's room temperature superconductor patent
      application because the examiner determined the invention was inoperative and lacked utility, as no assertions of room
      temperature superconductivity had been recognised or verified by the scientific community.
    original_excerpt: Patent Office documents show that the room temperature superconductor patent was rejected because it
      was determined by the examiner that the invention was 'inoperative and therefore lacks utility' because 'no assertions
      of room temperature superconductivity have currently been recognised or verified by the scientific community'.
