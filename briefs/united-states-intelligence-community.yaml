  content: The All-Domain Anomaly Resolution Office (AARO) found the alleged 1961
    Special National Intelligence Estimate on UFOs lacked Intelligence Community tradecraft
    standards and possessed significant inconsistencies with genuine documents, including
    its short length, incorrect formatting, inconsistent branding, lack of a dissemination
    block and coordination language, loose narrative style, convoluted logic, imprecise
    and casual language, and superficial treatment of globally significant issues.
  original_excerpt: 'AARO found the document lacked IC tradecraft standards and possessed
    significant inconsistencies with SNIE''s and National Intelligence Estimates of
    the general time period. These inconsistencies included: the document''s short
    length, incorrect formatting, inconsistent branding, lack of a dissemination block
    and coordination language, loose narrative style, convoluted logic, imprecise
    and casual language, and its superficial treatment of globally significant issues.'
