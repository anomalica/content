  - claim_id: cd34e165-9524-465a-b8d5-ec35db7962b8
    claim_hash: 626508f42b0b841c6659880356df5130bf0c1be90825bd6fa2be95dbc6e7ab24
    content: In his autobiography 'Return to Earth', Buzz Aldrin recounts that during an early-1970s interview to the Kiwanis
      Club in Palmdale, California, he was asked what it felt like to be on the Moon and was overcome with a panic attack,
      forcing him to abandon the interview and rush from the stage.
    original_excerpt: 'In his autobiographical second book, “Return to Earth,” Buzz Aldrin recounts an experience he had during
      an interview in the early 1970’s. While speaking to local Kiwanis Club in Palmdale California (home of Edwards Air Force
      Base and many NASA contractor firms), Aldrin was asked a simple question: “What did it *feel* like to be on the Moon?”
      Almost immediately, Aldrin was overcome with a panic attack, and the harder he tried to remember, the worse it got.
      Finally, he was forced to abandon the interview and rush from the stage, followed by his then-wife Joan.'
    claim_type: testimony
    attestation: second_hand
