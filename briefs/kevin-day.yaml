  - claim_id: 0a0fbdf2-f4a8-4332-b4c1-188e8a3616a0
    claim_hash: 739929b39af560e9f89992dad5a646c961e32ae1b38c3cdf9b5e57c9e0e21b0f
    content: Kevin Day discovered that the radio communications data for the 2004 USS Nimitz Tic Tac UAP encounter had been
      erased from the USS Princeton's optical disk, even though the date and time stamps for the recordings remained.
    original_excerpt: But he was shocked to learn that the data for the Tic Tac encounter had been wiped. 'As it turns out,
      all of our comms had been erased. Now, every time you key a mic on the ship, it stamps the optical disk with a date
      and time stamp. All the date and time stamps were there but the actual comms were all missing.'
    claim_type: testimony
