    claim_hash: 881b5f209aca588d9b3b439d0e6ee9d25bba4997ff84b5afaeb18d6a0d76bed1
    content: Jeffrey Kripal recounted that Whitley Strieber told an audience he was fully aware that his visionary experience
      of the visitors described in his novel Communion was deeply informed by the bad science-fiction B movies he had seen
      as a child in the cold-war 1950s in southern Texas.
    original_excerpt: 'Reflecting on a talk by “alien abductee” Whitley Strieber about the experiences that informed his best-selling
      novel, Communion, Jeffrey Kripal notes the role played by popular culture: “One evening he [Whitley] explained to us
      that he was perfectly aware that his visionary experience of the visitors was deeply informed by the bad sci-fi B movies
      that he had seen in such numbers as a kid in the cold war 1950s in southern Texas.”'
