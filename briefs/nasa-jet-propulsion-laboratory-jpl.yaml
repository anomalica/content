  claim_hash: 06472cf860feb2cc56111f5162b75dcdcc93c54222134e6a0f0cbe032cf52bc8
  content: Richard C. Hoagland argues it is hard to imagine JPL's typing pool mistakenly
    writing 19200 in place of 9600 pixels and 82.94 kilometres in place of 41.5 kilometres,
    since if the original transmitted imaging resolution from Michael Malin's camera
    was 2048 pixels across and was subsequently downsized on Earth to 1024, the corresponding
    down-track dimension would have been precisely 19200 pixels, matching the original
    NASA caption and consistent with the image being missing 400 percent of its expected
    resolution.
