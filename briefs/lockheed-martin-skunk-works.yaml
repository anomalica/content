    content: Lockheed Martin stated that Tom DeLonge reached out to Skunk Works with interest in collaborating on a documentary
      focused on secret machines and advanced development projects, that multiple Skunk Works team members met with him to
      explore his vision, and that Lockheed Martin ultimately decided not to move forward with participation in the documentary.
    original_excerpt: '''Tom DeLonge reached out to Skunk Works with interest in collaborating on a documentary focused on
      secret machines and advanced development projects,'' Lockheed Martin said in a statement. ''Multiple members of the
      Skunk Works team met with DeLonge to explore his vision for the documentary, as we would with any individual or organisation
      interested in telling the story of Skunk Works and the technologies we''ve developed. We ultimately decided to not move
      forward with our participation in the documentary. During this exploration period, DeLonge attended a Skunk Works employee
      event.'''
