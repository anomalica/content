    content: Whitley Strieber proposes that a time traveller returning to the past would be constrained by the grandfather
      paradox to a very limited set of actions, and could evade that constraint by creating beings that never existed in the
      past, so that the beings reported as aliens would in fact be artificial creations made by future humanity to gain freedom
      of action in the present.
    original_excerpt: something called the grandfather paradox would kick in, and you would have a very limited number of
      things you could do in the past without changing the present, unless you could deceive the grandfather paradox. ...
      In other words, the aliens aren't aliens at all. They are something that was created by humanity in the future to give
      us, them, more freedom of action in the present.
