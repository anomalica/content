    content: Under the National Defense Authorization Act 2023 (NDAA), witnesses who come forward with information about UAP
      secrets tied to a presidential executive order or national security order are deemed not to be violating any laws, but
      they have no such protection if they speak publicly about what they know.
    original_excerpt: The law also ensures that, even if these dark UAP secrets are tied up with a presidential executive
      order or some dizzyingly draconian national security order, witnesses who come forward with information are deemed not
      to be violating any laws. But note well, if they speak publicly about what they know, there is no such protection.
