  - claim_id: 5ecf4f0f-bf3b-4cdd-bd5f-565ed739b1a8
    claim_hash: 7cacd347d8cb0c6c6fe3c140c580012589b3e1096f4e6c8d29df7c7bc47cfd48
    content: Under the National Defense Authorization Act 2023, a UAP program does not have to be disclosed to Congress if
      those administering it conclude that the preponderance of available information indicates the observed object and associated
      events likely relate to a special access program or compartmented access program that has already been explicitly and
      clearly reported to the relevant committee.
    original_excerpt: if those administering this program, '… conclude that the preponderance of information available regarding
      the disclosure indicates that the observed object and associated events and activities likely relate to a special access
      program or compartmented access program that, as of the date of the disclosure, has been explicitly and clearly reported
      …' to the relevant committee, then it does not have to be disclosed.
