    content: Section 1632(a)(1)(B) of the National Defense Authorization Act 2023 requires the US Department of Defense to
      ensure reporting on any activity or program relating to unidentified anomalous phenomena, including with respect to
      material retrieval, material analysis, reverse engineering, research and development, detection and tracking, developmental
      or operational testing, and security protection and enforcement.
    original_excerpt: S1632(a)(1)(B) of the NDAA...requires the DOD to ensure reporting on, 'any activity or program by a
      department or agency of the federal government or a contractor of such a department or agency relating to unidentifi
      ed anomalous phenomena, including with respect to material retrieval, material analysis, reverse engineering, research
      and development, detection and tracking, developmental or operational testing, and security protection and enforcement.'
