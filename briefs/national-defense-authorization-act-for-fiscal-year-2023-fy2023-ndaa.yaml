    content: The Historical Record Report is provided by the Department of Defense in response to a requirement established
      in Section 6802(j) of the National Defense Authorization Act for Fiscal Year 2023, which requires a written report detailing
      the historical record of the United States Government relating to UAP submitted to congressional defense and intelligence
      committees and congressional leadership not later than 540 days after enactment of the Intelligence Authorization Act
      for Fiscal Year 2023.
    original_excerpt: 'This HR2 is provided by DoD in response to a requirement established in the National Defense Authorization
      Act (NDAA) for FY 2023, Section 6802(j), which states: "Not later than 540 days after the date of the enactment of the
      Intelligence Authorization Act for Fiscal Year 2023, the Director of the Office shall submit to the congressional defense
      committees, the congressional intelligence committees and the congressional leadership a written report detailing the
      historical record of the United States Government relating to unidentified anomalous phenomena."'
