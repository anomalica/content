    content: Provisions requiring an independent agency such as the Government Accountability Office (GAO) or the Department
      of Defense Office of Inspector General (DOD IG) to oversee UAP program reporting were included in the original draft
      UAP legislation but were dropped from the statute that finally passed as the National Defense Authorization Act 2023.
    original_excerpt: There were provisions in the original draft UAP legislation that would have required an independent
      agency such as the congressional watchdog, the Government Accountability Offi ce (the GAO), or the DOD's Office of the
      Inspector General (the DOD IG) to keep the gatekeepers honest but those clauses were dropped from the statute that finally
      made it through the house.
