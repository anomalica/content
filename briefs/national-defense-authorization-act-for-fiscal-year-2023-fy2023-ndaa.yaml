    content: The James M. Inhofe National Defense Authorization Act for Fiscal Year 2023 (FY 2023 NDAA) defined Unidentified
      Anomalous Phenomena (UAP) as unidentified anomalous phenomena, including airborne objects that are not immediately identifiable,
      transmedium objects or devices, and submerged objects or devices that are not immediately identifiable.
    original_excerpt: 'The FY 2023 National Defense Authorization Act (NDAA) defined UAP as "unidentified anomalous phenomena,"
      which include: (a) airborne objects that are not immediately identifiable, (b) transmedium objects or devices, and (c)
      submerged objects or devices that are not immediately identifiable.'
