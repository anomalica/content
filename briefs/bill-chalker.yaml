    content: The critic's "Chinese man of mystery" was a lab worker and postgraduate biochemistry student who was part of
      Bill Chalker's analytical team, and his DNA was tested and found to be normal Chinese DNA with no rare or unusual aspects.
    original_excerpt: The critic’s “Chinese man of mystery” was no real mystery. He was a lab worker—a postgraduate in biochemistry—who
      had been part of our analytical team. Even though we believed that he had not come into direct contact with the hair
      sample, given that he was in the lab where we had stored the sample for a while, we felt we needed to rule his DNA in
      or out as the possible source of the unusual DNA found. It turned out his DNA was as expected, normal Chinese DNA with
      no rare or unusual aspects.
