  content: Karl E. Nell considers David Charles Grusch's assertion concerning the
    existence of a terrestrial arms race occurring sub-rosa over the past eighty years
    focused on reverse engineering technologies of unknown origin to be fundamentally
    correct, and considers it an indisputable realisation that at least some of these
    technologies of unknown origin derive from non-human intelligence.
  original_excerpt: “His assertion concerning the existence of a terrestrial arms
    race occurring sub-rosa over the past eighty years focused on reverse engineering
    technologies of unknown origin is fundamentally correct, as is the indisputable
    realization that at least some of these technologies of unknown origin derive
    from non-human intelligence,” said Karl Nell, the retired Army Colonel who worked
    with Grusch on the UAP Task Force.
