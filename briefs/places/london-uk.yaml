    claim_hash: 2b76470909914fa7225b08059c650ffce8376589a48e3a8ec60cd5f90cfb7a39
    content: In the summer of 1968, a British woman and a companion, driving from London toward Stratford-upon-Avon near Oxford
      and Burford at around four in the afternoon, saw a shining disk in the sky the same apparent size as the full moon,
      which darted, dodged, and swung about before sinking behind trees, and was also seen by occupants of another car that
      stopped to watch.
    original_excerpt: In the summer of 1968, I was driving home from London to a place near Stratford to visit some friends
      for the weekend... Just outside Oxford, near Burford, we both saw a shining disk in the sky (it was around four in the
      afternoon and the sun was quite high). The disk was about the same size as the full moon in the evening. We slowed,
      and then stopped the car to watch it while it darted and dodged and swung about in the sky... Another car stopped to
      watch too. Eventually it sank down behind the trees, and we drove on.
    claim_type: testimony
    attestation: second_hand
