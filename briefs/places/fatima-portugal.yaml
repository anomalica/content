    content: Maria dos Santos Carreira recalled that after the sign at the Cova da Iria on 1917-08-13, the crowd went to Fatima
      and rioted against Artur Santos and Father Ferreira over the abduction of the children.
    original_excerpt: As soon as this sign came to an end, everyone went off to Fatima. They protested and rioted against
