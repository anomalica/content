    claim_hash: 6a2c7ec377fe4543698169b08dcbba7a4b5a411da41e89c94f0ae2f341b8cbd1
    content: In the 1950s, a US Navy commander named McLaughlin, who was in charge of V-2 rocket experiments at White Sands,
      New Mexico, used a theodolite to track an unidentified egg-shaped object travelling at approximately 90 kilometres altitude
      and about 11 kilometres per second while tracking a V-2 rocket and a WAC Corporal rocket.
    original_excerpt: In the 1950s, a Commander McLaughlin, a Navy commander who was in charge of V-2 experiments down in
      White Sands, New Mexico, they were using a theodolite, which essentially is a telescope that also gives you readings
      of altitude and azimuth. And they were tracking a V-2 and a WAC corporal, I think, attached to it when they saw something
      else. And they managed to get the theodolites on this object, and it was about 56 miles up and going about 7 miles per
      second.
    claim_type: testimony
    attestation: second_hand
