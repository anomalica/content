    content: Hal Puthoff considers that the public does not have detailed access to daily activities in Pentagon projects
      and offices, and that those not directly connected, such as staff in the Public Affairs Office, are often themselves
      unclear about details concerning highly classified sensitive programs for which they have little to no access.
