      electrons can be in two places at once and remain connected in a way that allows them to influence one another, offers
      a way to understand bilocation, though he noted that larger objects have not been scientifically observed to be in two
      places at once and that in the cases of saints, bilocation is chiefly associated with acts of charity.
    original_excerpt: “The idea of saints being in two places at once is intriguing,” he wrote. “Physical laws seem to suggest
      the impossibility of being in two places at once, but the idea of ‘superposition,’ in quantum mechanics suggests that
      atoms and electrons can be in two places at once. Not only that, but these two things seem to remain connected to one
      another on some level in that they can influence one another. Of course, larger objects have not been observed (scientifically
      at least) to be in two places at once. And, I thought it interesting, that in the cases of saints, bilocation is chiefly
      associated with acts of charity.”
