      claimed had a landing and takeoff point in the ocean east of Miami, north of Bermuda, tracked by a specific electronic
      signature when transitioning into or out of the water, and were filmed on several occasions transitioning between water
      and air.
    original_excerpt: '''He said there were times when they were diverted from these missions to track UFOs off the east coast
      of Florida. His claim was the UFOs had a landing and takeoff point in the ocean east of Miami, north of Bermuda. There
