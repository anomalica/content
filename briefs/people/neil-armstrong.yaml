    content: Richard C. Hoagland and Ken Johnston used transcripts from the Apollo 11 mission logs to reconstruct the post-landing
      lockdown procedures Aldrin and Armstrong went through, determining that Aldrin's communion ceremony took place precisely
      thirty-three minutes after touchdown on the lunar surface.
