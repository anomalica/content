    content: 'Hereward Carrington listed assumptions underlying his belief that spirits exist: that consciousness persists
      past physical death, that it retains memory and personal identity, that it first inhabits an astral body of the same
      shape as the physical body, that it is present in our surroundings and possesses supernormal psychic powers, that it
      is normally invisible but can become visible and communicate with those present, and that it can only act on the physical
      world through an intermediary.'
    original_excerpt: 'Carrington lists the assumptions he''s making in conjunction with his concept that spirits exist. They
      are: our consciousness persists past physical death; it retains memory and personal identity; first it inhabits some
      kind of astral body "of the same shape as our physical body"; it is in our surroundings and possesses supernormal, psychic
      powers; it''s normally invisible but can become visible and communicate with those present; it can only act on the physical
      world through an intermediary.'
