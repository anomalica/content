  - claim_id: 614a3e7d-84fc-4e60-8038-378286cd3e73
    claim_hash: b9fc30320259a4a7599293f1d36df26cadf3a4c21544362552b0c7204aa7c38d
    content: After the March 1993 UCLA address, Jan Harzan followed Ben Rich, introduced himself, and asked him how the technology
      worked; Rich responded by asking 'How does ESP work?' and then said 'That's how it works' when Harzan answered 'all
      points in space and time are connected'.
    original_excerpt: And I said, "Hi, I'm Jan Harzan, I'm an alumni. I have a real fascination with what you're talking about,
      particularly the propulsion side of this". And I said, "Can you tell me how it works?" And he said, "Well, let me ask
      you. How does ESP work?" And I was like two steps back. I wasn't really expecting a question. I was looking for an answer.
      And I just quipped real quickly, "I don't know, all points in space and time are connected." And that's when he said,
      "That's how it works." And he turned and walked out of the room.
