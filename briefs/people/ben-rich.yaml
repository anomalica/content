  - claim_id: 8d7546d8-dfb6-4b20-8341-a2143a84596d
    claim_hash: ef4c459fb64a3c9efa96cee6219066ad31b7d7dfd846cd14d167a9f0a369043b
    content: Ross Coulthart suggests believers in the extra-terrestrial explanation for UAPs may have been too credulous in
      taking Ben Rich literally, since the United States might want its strategic rivals Russia and China to think it has
      an edge with such advanced technology, so Rich may have been spreading disinformation through a prominent aerospace
      journalist.
