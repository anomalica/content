    content: Richard C. Hoagland found a long-abandoned line of thought by early physicists, including James Clerk Maxwell,
      that certain problems in electromagnetics could be solved by imposing higher spatial dimensions into the equations,
      with energies from these higher dimensions reflected in the lower three-dimensional universe through tetrahedral geometries.
    original_excerpt: Hoagland then found that there was a long-abandoned line of thought by some of the masters of early
      physics, including James Clerk Maxwell, which included the idea that certain problems in electromagnetics could be solved
      by the imposition of higher spatial dimensions into the equations. The energies coming from these higher dimensions
      would then be "reflected" in our lower three dimensional universe through tetrahedral geometries.
