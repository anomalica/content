    claim_hash: b88fd2e37be27f71378b2a6c48168f6979f61668bb8e62470967f33604ce0975
    content: In October 1993, while driving home along the same road after visiting her friend for a second birthday and playing
      Bingo again, Kelly Cahill felt sudden terror at a certain spot and by the next morning had remembered nearly everything
      that happened, aside from some remaining missing time.
    original_excerpt: I went up to [my girlfriend's] house again in October, this time for her other daughter's… birthday,
      and again we went to Bingo. On the way home from Bingo that night, we went along the same road, and as we passed a certain
      spot I just got this incredible feeling of terror go through me... All of a sudden I just started remembering and by
      the next morning I. had remembered just about everything that happened, except there's still missing time that I can't
      [remember].
