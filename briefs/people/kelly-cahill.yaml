    content: Kelly Cahill described her first "dreaming" as a sensation of energy being violently sucked from her chest, followed
      by waking to find a black-hooded figure about two metres tall with big red eyes standing between five and thirty centimetres
      from her.
    original_excerpt: all of a sudden I felt like something was being sucked out of my chest and the pressure... standing
      beside me and only that far away from me (between five inches to a foot at the most) was a black figure about seven
      feet tall (because he just reached the top of my mirror) with a hood on it, with big red eyes.
