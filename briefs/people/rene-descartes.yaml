  - claim_id: 45ef5a19-661b-4891-acb6-536c740fa25f
    claim_hash: 57fde78f380a25970f1cbb78414ffd06ec6cd0a30b37019542bdc72f63a7aec0
    content: Jacques Vallée argues that Cartesian spacetime coordinates, popularised around the time of René Descartes through
      the cultural artifact of graph paper, should be abandoned as the basis for a theory of information.
    original_excerpt: 'Some genius around the time of Descartes (perhaps it was Descartes himself) popularized the idea of
      representing and measuring motions in terms of distance from two axes intersecting at right angles: “Cartesian” coordinates
      were born, and they have remained imprinted in our minds ever since. When we can draw something on graph paper, we think
      we understand it. I submit that it is proper to shake from our theoretical ankles the chains of spacetime.'
    claim_type: opinion
    attestation: first_hand
