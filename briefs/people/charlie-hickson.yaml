      floated along with the spacecraft and the tracking light had been seen flashing on them, but that during a subsequent
      pass the tracking light was no longer flashing on similar floating debris, leading him to conclude the tracking light
      had burned out.
    original_excerpt: Hey, Houston. It looks like our tracking light's burned out. Dick hasn't been able to find us in his
      sextant. And on the first nightside pass we had little bits and pieces floating along with us and we could tell that
