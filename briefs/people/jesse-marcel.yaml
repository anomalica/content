    content: At approximately 9:30 a.m. on 1947-07-08, William Blanchard phoned Walter Haut's office and dictated a press
      release stating that the Roswell Army Air Force Base had in its possession a flying disc recovered from a ranch northwest
      of Roswell, with Jesse Marcel flying the material to higher headquarters.
    original_excerpt: At approximately 9:30 a.m. Col. Blanchard phoned my office and dictated the press release of having
      in our possession a flying disc, coming from a ranch northwest of Roswell and Marcel flying the material to higher headquarters.
