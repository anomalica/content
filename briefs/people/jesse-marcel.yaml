    content: Upon his return from Fort Worth, Jesse Marcel described to Walter Haut taking pieces of the 1947 Roswell wreckage
      to Roger Ramey's office and, after returning from a map room, finding the remains of a weather balloon and a radar kite
      substituted in place of the original wreckage.
