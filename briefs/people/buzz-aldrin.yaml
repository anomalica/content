    claim_hash: 34671aecf04e9cd5f7ea39949065e7db9627ad2a44110c1516414ae23bb0d722
    content: In a 1999 interview with Salon.com, Buzz Aldrin said he has been frustrated since the day he left the Moon by
      the question of how it felt to walk on the Moon, and that he does not know how to answer it.
    original_excerpt: “I try to answer,” he admits wearily. “I say, ‘It felt terrific. Tremendously satisfying. The mission
      was going well, and our training had prepared us perfectly.’ “But then people say, ‘No ... how did it feel? How did
      it *really* feel?’” He bristles. “For Christ’s sake, I don’t know! I just don’t know. I have been frustrated since the
      day I left the Moon by that question.”
