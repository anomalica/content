    claim_hash: 37208cb2746876d1d39f41187e3a1f57b7e03bcb5bb25aef122857cd43a4eaaa
    content: Buzz Aldrin stated in his 1969 NASA technical debrief that the idea was to get a gravity direction, do a two-star
      alignment, and look at the torquing angles afterward to indicate drift since the last alignment, with the initial gravity
      alignment combined with the two-star alignment producing a new location of the landing site.
    original_excerpt: 'Aldrin: “The idea was to get a gravity direction and then to do a two-star alignment and look at the
      torquing angles after the two-star check which would then give an indication as to what the drift had been since the
      last alignment. The initial gravity alignment, combined with the two-star alignment, would produce a new location of
      the landing site.”'
