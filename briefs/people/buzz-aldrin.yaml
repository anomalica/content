    content: In the late 1990s, Marvin Czarnik related a story through a mutual friend that Buzz Aldrin, when asked about
      rumours of UFOs and strange ruins on the Moon during a round of golf, picked up his clubs and stomped off the course
      and had not spoken to the friend since.
    original_excerpt: In the late 1990s, Czarnik related a story through a mutual friend. Aldrin had joined this friend for
      a round of golf, and the friend had decided he wanted to ask Aldrin about the rumors of UFOs and the strange ruins that
      they had supposedly seen on the Moon. Around the fourth hole, Czarnik’s mutual friend put the question to Aldrin, who
      responded by picking up his clubs and stomping off the course. The two men have not spoken since.
