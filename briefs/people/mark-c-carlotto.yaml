    claim_hash: d23611f36419026310ca0ef6be8a32735db68a1f78c0c273abac9a8e740a5f33
    content: 'Analysis of video from Space Shuttle mission STS-80, recorded by a camera aboard the Space Shuttle Columbia
      in 1996, examines three different phenomena: two slow-moving circular objects, a number of fast-moving objects in space
      near the shuttle, and a luminous apparition near the earth''s surface.'
    original_excerpt: 'Analysis of video from Space Shuttle mission STS-80 provides new insight into a number of unusual events
      captured by a camera aboard the space shuttle Columbia in 1996. Three different phenomena are analyzed: 1) two slow
      moving circular objects, 2) a number of fast moving objects in space near the shuttle, and 3) a strange luminous apparition
      near the earth''s surface.'
