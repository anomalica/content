    content: 'At a Brazilian UFO expo, Mark Carlotto reported that National Aeronautics and Space Administration (NASA) told
      the 1997-11 SPSR meeting there are two groups within NASA regarding the Cydonia objects: one wanting to prove UFO researchers
      wrong, and a small but growing group believing NASA has interesting data worth a closer look.'
    original_excerpt: “Moreover, they said that they are in fact very interested in these objects, for two reasons. There
      are two groups in NASA. One group believes that [UFO researchers] are all wrong, and they want to prove it. So they
      want to take these pictures to prove that you’re wrong, so you’ll go away. The other group—and our sense is that it’s
      a small but growing group within NASA—believes that we have some interesting data, and they want to take a closer look
      at it.”
