    content: After falling ill, Jacinta Marto told Lúcia (Fatima seer) that Our Lady had come to visit and said she would
      soon take Francisco Marto to heaven, that Jacinta would go to a hospital and suffer a great deal, and that Jacinta's
      mother would take her to the hospital and she would then have to stay there alone since Lúcia would not come with her.
    original_excerpt: “Our Dear Lady came to visit us and said she would soon take Francisco with her to heaven. She asked
      me if I wanted to convert more sinners. I said yes. She then said that I would go to a hospital and suffer a great deal
      there. I asked her whether you would come with me. She said no, and that is what hurts me the most. She said my mother
      would take me to the hospital, and after that I would have to stay there alone.”
