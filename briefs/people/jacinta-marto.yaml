    claim_hash: 682ea05173e61c812cf9c41bfba83635479f1de9b8dfabebe748b84efe0b6d0d
    content: Two years after the events of 1991, John Paul II told Italian journalist Vittorio Messori that the three Portuguese
      children of Fatima, shortly before the outbreak of the Russian Revolution (1917), heard that 'Russia will return' and
      'in the end my Heart will triumph', and that it was impossible they could have invented such statements since they were
      ignorant of history, geography, and social and ideological movements, yet what they announced is exactly what happened.
    original_excerpt: “And what about the three Portuguese children of Fatima, who unexpectedly and shortly before the outbreak
      of the October revolution heard, ‘Russia will return’ and ‘in the end my Heart will triumph’? It is impossible that
      they could have invented such statements. They were ignorant of history and geography, knew even less about social movements
      and ideological developments. And yet, what they announced is exactly what has happened.”
