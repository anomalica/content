      eighty years focused on reverse engineering technologies of unknown origin is fundamentally correct, as is the indisputable
      realization that at least some of these technologies of unknown origin derive from non-human intelligence,” said Karl
      Nell, the retired Army Colonel who worked with Grusch on the UAP Task Force.
