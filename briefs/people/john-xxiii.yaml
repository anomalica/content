    content: On 1959-08-17 three men sat and discussed the contents of the Third Secret until late at night, after which Pope
      John XXIII decided he could not and would not publish it, saying it was certain it did not deal with his own papal reign.
    original_excerpt: The three men sat and discussed the contents of Lúcia’s writing until late at night, then the pontiff
      made his decision. “I cannot publish this and will not publish it. I’ll leave it for others to do so. It is certain
      that it does not deal with my reign.”
