      the American people are inherently and historically opposed to secret societies, secret oaths, and secret proceedings.
    original_excerpt: “The very word ‘secrecy’ is repugnant in a free and open society; and we are as a people inherently
      and historically opposed to secret societies, to secret oaths and to secret proceedings. We decided long ago that the
