    content: Douglas Dean Johnson considers the National Defense Authorization Act 2023 (NDAA) UAP legislation to reflect
      a perception among key members of Congress that important information on the subject may have been appropriately classified
      but that much important data has been 'stovepiped' - sealed within specific projects or programs in ways that impeded
      meaningful progress and congressional oversight.
    original_excerpt: He says, ‘I believe that the legislation reflects a perception, by some key members of Congress, that
      there is important information on this subject to which classification may have been appropriate, but that much important
      data has been “stovepiped” – sealed up within specific projects or programs in ways that have impeded meaningful progress
      towards coming fully to grips with the entire scope of UAP, and perhaps also stymied meaningful congressional oversight.
