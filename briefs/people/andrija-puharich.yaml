    content: On 1960-06-29 in the late evening, Robert Monroe attempted an out-of-body visit to Andrija Puharich somewhere
      in California but instead found himself with four unfamiliar people around a table who displayed wariness and refused
      to answer his questions, with one man saying "Don't tell him!"; the experience lasted eighteen minutes, and Andrija
      Puharich later reported no connection to the described scene.
    original_excerpt: '6/29/60 Late Evening ... under plan to visit Dr. Andrija Puharich somewhere in California. Moved blindly
      for a short period, then stopped. Four people were seated around a table... one of the men said, "Don''t tell him!"...
      Time away, eighteen minutes. Comment: No connection with Dr. Puharich''s activities at the time, as he reports.'
