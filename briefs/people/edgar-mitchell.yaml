  - claim_id: 88175460-e37c-4675-9e9a-d1b48b56455d
    claim_hash: 0621d3b2f0f49c2993fd2f918a25baac519c96d4728d82f95c2af531f1268c53
    content: During the Hoagland-Mitchell debate, Edgar Mitchell said that when people asked him what it felt like to be on
      the Moon, he did not initially think it was a germane question, but the question irritated him because he could not
      answer it, prompting him to ask himself whether he should know what he felt like on the Moon.
    original_excerpt: “Basically, when people asked me, “What did it feel like to be on the Moon?” being a super rationalist
      and a Ph.D., and all of that, I didn’t think it was a germane question. I thought if you ask me what did I *do* on the
      Moon, or what did I *think* about on the Moon, I could have told you. But what did I ‘feel?’ I didn’t know... First
      of all, it irritated me because I didn’t have an answer to it, and eventually I asked myself, “*Should* I know what
      I felt like on the Moon?”
