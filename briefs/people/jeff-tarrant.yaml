    claim_hash: 1f6530176a4cb178f1584c885fbeadbd32193efca8ccb67980030e95370e123e
    content: 'The Windbridge Institute EEG study of six mediums monitored the mediums'' brain activity using electroencephalography
      (EEG) during four tasks: recollection (thinking about a living person known to the medium), perception (listening to
      information read about a person), fabrication (making up a fictitious person and thinking about them), and communication
      (communicating with a deceased person known to the medium).'
    original_excerpt: 'In a study in which we monitored the brain activity of six Windbridge Institute mediums using electroencephalography
      (EEG), we found differences for four tasks the mediums performed: recollection (think about a living person you know),
      perception (listen while I read you information about a person), fabrication (make up someone and think about him/her),
      and communication (communicate with a deceased person you know).'
