    content: Jeff Tarrant compared scans of Laura Lynne Jackson's brain during a psychic reading, when she used living-agent
      psi, with scans taken during a mediumship reading when she engaged survival psi, to see whether her two described types
      of psi would register differently in her brain.
    original_excerpt: He then decided to take his study of Laura’s process one step further, by comparing scans of her brain
      during a psychic reading—when she used her living-agent psi—with those taken during a mediumship reading when she engaged
      her survival psi. In other words, he wanted to see if what Laura described as her use of two distinct types of psi would
      actually register as different in her brain.
