    claim_hash: 1011f37369ee5b537e36aa4e7e1c796a168f60031169bd28da8e78ee773b03e5
    content: Jeff Tarrant found that one area of Laura Lynne Jackson's brain becomes active while she is receiving mediumship
      information and a different area becomes activated when she is involved in a psychic reading, matching Laura Lynne Jackson's
      own report that she sees psychic information in her left visual field and mediumship information in her right visual
      field.
    original_excerpt: One area of the brain is becoming active while she is receiving mediumship information; the other area
      is becoming activated when she is involved in a psychic reading. Coincidentally—or not—Laura reports that she sees psychic
      information in her left visual field, and she sees mediumship information on her right visual field. Actually, that
      is exactly what we see on these brain images. So this appears to be confirmation of what Laura reports from her own
      experience.
