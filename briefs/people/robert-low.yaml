  - claim_id: 7bebb911-1cbd-4348-855d-6373c59a6811
    claim_hash: 41d55b2e00299203be71e743d6ad27c371329c77762be563a278c3a6897dcdf8
    content: Robert Low wrote a memo to his superiors stating that the Condon Report study would be conducted almost exclusively
      by non-believers who could add an impressive body of evidence that there is no reality to the observations, while being
      described publicly as a totally objective study.
    original_excerpt: Our study would be conducted almost exclusively by non-believers who, although they couldn't possibly
      prove a negative result, could and probably would add an impressive body of evidence that there is no reality to the
      observations. The trick would be, I think, to describe the project so that, to the public, it would appear a totally-objective
      study, but to the scientific community, would present a group of non-believers trying their best to be objective but
      having an almost zero expectation of finding a saucer.
