    content: Ron Evans, the command module pilot for Apollo 17, observed that the Moon had a "non-monotone" appearance and
      more colour variation than he had expected.
    original_excerpt: Even Ron Evans, the command module pilot for Apollo 17 who made constant observations of the landing
      site, commented on the "non-monotone" nature of the region and the Moon in general. "You know, to me the Moon's got
      a lot more color than I'd been led to believe. I kind of had the impression that everything was the same color. That's
      far from being true."
