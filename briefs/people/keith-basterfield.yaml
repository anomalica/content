    content: Keith Basterfield reported that the X-ray of Susan's mouth looked like there was some kind of thin particle in
      the place where she claimed to have an implant, and that a subsequent full-face X-ray by a radiographer did not show
      anything abnormal, but a later examination by an experienced radiographer found something on the original X-ray believed
      to be an artefact of the X-ray process rather than something actually in the mouth.
    original_excerpt: '"It looked like there was some kind of thin particle in her mouth in the place where she claimed to
      have an implant. The dentist decided to send Susan to a radiographer to have a full face X-ray taken, but this did not
      show anything abnormal. Later I had the original X-ray examined by an experienced radiographer, who stated that the
      X-ray did in fact have something on it but he believed it was merely an artifact of the X-ray process and not indicative
      of anything actually in the mouth."'
