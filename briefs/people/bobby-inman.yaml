    claim_hash: f1bf85f95b70bcfdc789a6a01a36236e7fa6a6b4a827b883045fd76f3317da5d
    content: Richard C. Hoagland questions why Bobby Inman, a prominent intelligence figure, headed the oversight committee
      at the California Institute of Technology (Caltech) that oversaw civilian unmanned exploration of Mars, and considers
      this connected to the potential national security consequences of the discovery of artificial ruins at Cydonia by the
      Viking programme a quarter century earlier.
    original_excerpt: So what was the nation’s most celebrated spook doing heading an oversight committee at one of its leading
      private universities and, specifically, a committee overseeing all civilian unmanned exploration of the planet Mars?
      Could it have anything to do with Viking’s discovery, a quarter of a century before, of a set of artificial ruins at
      Cydonia and the potential national security consequences of that discovery?
