    content: In the Project Condign files, Boris Sokolov reported there were 40 cases in which Soviet pilots encountered UFOs,
      were commanded to first chase and then shoot at them, and in which the UFO would speed up causing the pursuing Soviet
      aircraft to lose control and crash, with three such crashes occurring and two pilots dying.
    original_excerpt: He said there were 40 reported cases where, 'Pilots encountered UFOs. Initially they were commanded
      to chase, then shoot. When our pilots would engage the UFO, it would speed up, our aircraft would give chase loose [sic]
      control and crash. That happened three times and twice the pilots died.'
