    content: When Ted Jacobs asked Whitley Strieber how the being's eyes looked closed, the mental image spontaneously closed
      its eyes, showing the structures recede, wrinkle, and the lids close just below the eyeball's middle.
    original_excerpt: 'When he asked me how they looked closed, I got another shock: The image closed its eyes. I saw the
      huge, glassy structures recede and loosen, becoming wrinkled, and the lids come down and up at the same time, to close
      just below the middle of the eyeball.'
