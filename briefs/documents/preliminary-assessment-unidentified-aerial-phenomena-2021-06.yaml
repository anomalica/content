    content: According to the Office of the Director of National Intelligence's Preliminary Assessment on Unidentified Aerial
      Phenomena, UAP are objects that are not immediately identifiable and lack a single explanation.
    original_excerpt: 'According to the Office of the Director of National Intelligence''s Preliminary Assessment on UAP,
      UAP are objects that are not immediately identifiable, lack a single explanation, and fall into one of five potential
