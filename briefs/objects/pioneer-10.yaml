    claim_hash: ede747ac981d690fb6a8a398e525c8a57b3873eec0190fa47c412bad4eb3621b
    content: If no terminal manoeuvres are performed, the Pioneer 10 and Pioneer 11 spacecraft will never, in 10^10 years,
      enter any other solar system, even if every star in the Milky Way Galaxy has a planetary system comparable to our own,
      and could only be intercepted by an interstellar spacefaring society much more advanced than our own.
    original_excerpt: If no such terminal manoeuvres are performed, simple collision physics calculations show that the spacecraft
      will never, in 10¹⁰ years, enter any other solar system - even if every star in the Milky Way Galaxy has a planetary
      system comparable to our own. In this case, the spacecraft can be intercepted only by an interstellar spacefaring society
      much more advanced than our own.
