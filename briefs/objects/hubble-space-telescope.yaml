    content: An anonymous source, in a call to Richard C. Hoagland a few months after the Mars Observer voicemails, said the
      Hubble Space Telescope was being used to photograph UFOs using its high-speed photometer instrument, and that the then-imminent
      Hubble repair mission would secretly bring back videotapes of the event.
    original_excerpt: A few months later, another anonymous source told Hoagland that the Hubble Space Telescope was being
      used to “photograph UFOs” using a light gathering device called the “high speed photometer,” and that the (then) imminent
      “Hubble Repair Mission” was going to secretly bring back a load of videotapes of the event.
