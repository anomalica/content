    claim_hash: 10eaa0287dd09960b020f5773a4fc09621f446e48d4570e6e1276f79bcbc4e40
    content: The USS Dunbar project was designed by Richard C. Hoagland and colleagues, drawing on the Star Trek motif of
      Gene Roddenberry, to stimulate interest in science among students at the 99% black inner-city Dunbar Senior High School
      by focusing research on real space science issues including the Hubble Space Telescope, the Magellan Venus Mission,
      and Mars.
    original_excerpt: Drawing unabashedly upon the Star Trek motif of his friend Gene Roddenberry, the U.S.S. Dunbar was designed
      by Hoagland and colleagues to stimulate interest in science among the students at this 99% black inner-city school by
      focusing their research on various real space science issues and arguments within NASA—such as the Hubble Telescope;
      the Magellan Venus Mission; and Mars.
