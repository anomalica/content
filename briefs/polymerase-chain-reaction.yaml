  - claim_id: 9e109c1c-ec23-466e-a2e9-ba1f2ebb8f36
    claim_hash: d108b3bad18c809e71805b99707c89a2cd6f25f1a39341279343238c9944b2ab
    content: In a September 22, 2002 interview on The Big Idea, Radio National ABC, David Berryman explained that forensic
      DNA analysis commonly uses Polymerase Chain Reaction (PCR) amplification of variable regions of DNA called short tandem
      repeats (STRs) because forensic samples such as a single hair or the DNA in fingerprint cells contain very little material,
      requiring PCR to increase the amount for analysis.
    original_excerpt: The most common way of doing the forensic analysis at the moment is using PCR amplification of variable
      regions of DNA, called ‘short hand and repeats’ or STRs, but with forensics in particular, you often work with very
      small amounts of material—it might be a single hair or even the DNA contained in the cells on a fingerprint on a stamp,
      or something like that—so you’ve really got very little DNA, there’s not really enough there to do any analysis on,
      somehow you’ve got to increase the amount, and that’s done by PCR.
