    content: Cynthia Nelson, as a phenomenologist, suspends judgment as to whether the Zeitoun apparition of the Virgin Mary
      is really real, and instead attempts to understand what people do when confronting stress, holding that if people define
      situations as real they are real in their consequences.
    original_excerpt: As phenomenologists we suspend judgment as to whether the apparition is *really real* (a question for
      scientific naturalism) and attempt rather to understand what people do when confronting stress. If men define situations
      as real they are real in their consequences.
