    content: The Joint Intelligence Objectives Agency (JIOA) evaluation of Wernher von Braun stated it could not be ascertained
      why he became a member of the SS, could not determine whether his positions in the SS were honorary, required by the
      Nazi party, or desired by him, and that no records of his arrest had been located.
    original_excerpt: '"It cannot be ascertained by this office what the reasons were which caused VON BRAUN to become a member
      of the SS. Neither can it be determined whether his positions in the SS were honorary, required by the Nazi party, or
      desired by VON BRAUN. No records of his arrest have been located."'
