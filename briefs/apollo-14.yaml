    content: High-resolution NASA lunar module film of the Apollo 14 return journey from the Moon, taken as the lunar module
      waited for the command module to rotate for docking, shows a trio of blue lights grouped in what looks like a dark triangular
      shape to the left of the command module against the blackness of space.
    original_excerpt: Another even more intriguing cluster of blue lights reported by Mitchell to his friend appears on the
      high-resolution NASA lunar module film of the return journey from the Moon, as the Apollo 14 lunar module waited for
      the command module to rotate to allow docking. There to the left of the command module, clearly defined, is a trio of
      blue lights grouped in what looks like a dark triangular shape against the pitch black of outer space.
