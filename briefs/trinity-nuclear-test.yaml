  content: In his 1950-05-19 letter to Eleanor Roosevelt, J. Robert Oppenheimer recounted
    that shortly before the Trinity nuclear test, people at Los Alamos were in a state
    of tension, and one morning almost the whole project staff went outdoors to stare
    at a bright object in the sky through binoculars and other optical instruments.
  original_excerpt: During the war, very shortly before the test of the first atomic
    bomb, people at Los Alamos were naturally in a state of some tension. I remember
    one morning when almost the whole project was out of the doors. staring at a bright
    object in the sky through glasses, binoculars, and whatever else they could find.
