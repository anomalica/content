    content: The next morning, while Leslie Kean made coffee in the kitchen, the ceiling light blinked twice and went off,
      and the microwave and an adjacent stove light also went off, while other kitchen lights remained on and lights in nearby
      rooms worked normally.
    original_excerpt: The next morning, I woke up and groggily went into the kitchen, turned on the light, and made coffee.
