    content: Leslie Kean believes that a true evaluation of mediumship as evidence for survival can occur only once a person
      has personally experienced a successful reading with a gifted medium, since otherwise it remains purely an intellectual
      exercise, comparable to reading about the taste of an apple rather than taking a bite.
    original_excerpt: But I believe that a true evaluation can occur only once one has experienced a successful reading with
      a gifted medium; then, one’s own perspective and assumptions will enter in as a necessary component, and each person
      will draw their own conclusion. Otherwise, this is purely an intellectual exercise, looking at this from the outside—like
      reading about the taste of an apple rather than taking the bite.
