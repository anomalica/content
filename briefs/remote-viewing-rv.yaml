    content: Joseph McMoneagle identifies a second kind of fraud in remote viewing experiments, which he calls accidental
      fraud, arising from information leakage such as a psychic adding information after completing a project because it was
      not written down at the time.
    original_excerpt: There is a second kind of fraud, which we can call accidental. I know, there are now lots of raised
      eyebrows out there. But, there are cases of information leakage in remote viewing experiments that support accidental
      fraud, or what could be construed as such. That would be where someone does something which s/he honestly believes is
      okay, simply because s/he's ignorant of the rules. Some psychics would believe that adding information after they've
      completed a project because they honestly were thinking the information at the time, but just didn't remember to write
      it down, is okay.
