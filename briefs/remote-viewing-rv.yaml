    content: Joseph McMoneagle explains that once a viewer accurately describes a location without an event, or describes
      the location and reports effects consistent with an event, the monitor can determine whether to move the viewer forward
      or backward in time, having already validated accuracy in a double-blind fashion.
    original_excerpt: Since they were asked to describe what's identified as a location first, then if they describe the location
      correctly but not the event, we know they are being accurate but have to move forward in time. If they describe the
      location and appear to be reporting on the effects from the event, then we know they have to be moved backward in time...
      we've allowed the viewer to be accurate in a double blind fashion first.
