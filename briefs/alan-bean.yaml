    claim_hash: b1c79b798304d2429d4b96c50c4b97ba1033cf89dacc0c08a996c5165628b42e
    content: During the Apollo 12 Air-to-Ground Voice Transcription, Alan Bean, looking out the Alignment Optical Telescope
      (AOT) in the dark quadrant of Intrepid, observed particles of light and flashes of light appearing to come from behind
      him in quadrant 1 and sailing off into space.
    original_excerpt: Roger. When you look out the AOT in the dark quadrant? You can see these lights - particles of light,
      flashes of light just seem to come from - in this case, I'm looking in quadrant 1 which is the left one. It's coming
      from behind me, the left, and they're just sailing off in space.
    claim_type: observation
    attestation: first_hand
