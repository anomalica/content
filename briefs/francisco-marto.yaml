claims:
- claim_id: 97d60b44-755b-4212-ae18-d23a4febc9bf
  claim_hash: c3d07176a4fd19e7f9817a8650518e44e3058df873f7e2c45af7a9e718948f4c
  content: An anonymous inside source at the Vatican, via Louis Emrich's 'diplomatic
    version' published in European News, said that on 1917-10-13 the Virgin Mary appeared
    for the last time before Jacinta Marto, Francisco Marto, and Lúcia (Fatima seer),
    the sixth in a series of apparitions, and after the 'dance of the sun' revealed
    a secret message to Lúcia warning that men must become better and beg forgiveness
    for their sins, and that a severe punishment would come to mankind in the second
    half of the twentieth century, that Satan would reign even in the highest places
    including the Church, that scientists would invent weapons able to destroy half
    of humanity within minutes, and that a great war would break out in the second
    half of the twentieth century bringing fire and smoke from the sky and the deaths
    of millions.
  original_excerpt: null
