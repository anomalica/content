  claim_hash: 0967665b98f042253cde6cf06177f3985835a3dcc64a13839904191b161aa429
  content: 'Luis Elizondo provided three different explanations for his sudden resignation:
    a fleeting job opportunity requiring immediate availability told to his supervisor
    on 2017-10-03; concerns over Departmental inaction on anomalous aerospace threats
    cited in a memorandum dated 2017-10-04; and his job being too stressful on his
    family told to Garry Reid by phone on 2017-10-06.'
  original_excerpt: Mr. Elizondo has provided three different explanations for his
    sudden resignation. On October 3rd he told his direct supervisor he was resigning
    because he had a fleeting job opportunity that required his immediate availability.
    In a memorandum dated October 4th he cited his concerns over inaction within the
    Department over "anomalous aerospace threats" as the reason for his resignation.
    On October 6th, via a phone call, he told me he resigned because his job was too
    stressful on his family.
