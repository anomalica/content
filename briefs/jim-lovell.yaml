    content: Jim Lovell said the Apollo 13 Lunar Module Aquarius was not named after the song in the play Hair, but after
      the Egyptian god Aquarius, symbolised as a water carrier who brought fertility, life and knowledge to the Nile Valley,
      mirroring the hope that the Lunar Module would bring life back from the Moon.
    original_excerpt: “Contrary to popular belief, it was not named after the song in the play Hair, but after the Egyptian
      God Aquarius. She was symbolized as a water carrier who brought fertility, and therefore, life and knowledge to the
      Nile Valley, as we hoped our Lunar Module, Aquarius, would bring life back from the Moon.”88
