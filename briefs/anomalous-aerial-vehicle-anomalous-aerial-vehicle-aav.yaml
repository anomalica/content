  content: Because the AN/SPY-1 radar aboard the USS Princeton (CG-59) was in the
    mode to handle Air Intercept of conventional aircraft, it never obtained an accurate
    track of the Anomalous Aerial Vehicles (AAVs) and quickly dropped them to reduce
    radar clutter, as with any other false target.
